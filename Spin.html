<html lang="en">

<title>Lucky Park | EPICPAGES</title>

<style>

/* =========================================================
   BASIC RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    color:#263238;
    overflow-x:hidden;

    background:
        linear-gradient(
            rgba(130,210,130,.30),
            rgba(100,180,90,.20)
        ),
        linear-gradient(
            #7ec8ed 0%,
            #bfe9a5 54%,
            #65ad4b 55%,
            #4f963c 100%
        );
}


/* =========================================================
   EPICPAGES WATERMARK
========================================================= */

.watermark{
    position:fixed;
    right:18px;
    bottom:16px;

    z-index:9999;

    padding:10px 18px;

    border-radius:30px;

    font-size:15px;
    font-weight:900;
    letter-spacing:2px;

    color:rgba(255,255,255,.92);

    background:rgba(0,0,0,.25);

    border:1px solid rgba(255,255,255,.35);

    backdrop-filter:blur(8px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.20);

    pointer-events:none;

    user-select:none;

    animation:watermarkGlow 3s ease-in-out infinite;
}

@keyframes watermarkGlow{

    0%,100%{
        opacity:.72;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-3px);
    }
}


/* =========================================================
   SKY
========================================================= */

.sun{
    position:fixed;

    width:120px;
    height:120px;

    top:35px;
    right:50px;

    border-radius:50%;

    background:#ffd54f;

    box-shadow:
        0 0 25px #ffe082,
        0 0 70px rgba(255,235,59,.55);

    z-index:-5;
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud{
    position:fixed;

    width:160px;
    height:48px;

    border-radius:50px;

    background:white;

    opacity:.75;

    z-index:-4;

    animation:
        cloudMove 35s linear infinite;
}

.cloud::before,
.cloud::after{
    content:"";

    position:absolute;

    background:white;

    border-radius:50%;
}

.cloud::before{
    width:75px;
    height:75px;

    left:25px;
    bottom:5px;
}

.cloud::after{
    width:60px;
    height:60px;

    right:20px;
    bottom:0;
}

.cloud1{
    top:100px;
    left:-220px;
}

.cloud2{
    top:200px;
    left:-500px;

    animation-delay:12s;
}

@keyframes cloudMove{

    from{
        transform:translateX(-100px);
    }

    to{
        transform:translateX(140vw);
    }
}


/* =========================================================
   TREES
========================================================= */

.tree{
    position:fixed;

    bottom:45px;

    font-size:80px;

    z-index:-2;

    animation:
        treeSway 4s ease-in-out infinite;
}

.tree1{
    left:20px;
}

.tree2{
    right:25px;
    animation-delay:1s;
}

.tree3{
    left:14%;
    font-size:65px;
}

.tree4{
    right:15%;
    font-size:70px;
    animation-delay:2s;
}

@keyframes treeSway{

    0%,100%{
        transform:rotate(-2deg);
    }

    50%{
        transform:rotate(2deg);
    }
}


/* =========================================================
   HEADER
========================================================= */

header{
    text-align:center;

    padding:
        30px
        15px
        15px;
}

header h1{

    font-size:
        clamp(38px,7vw,70px);

    color:white;

    text-shadow:
        3px 3px 0 #2e7d32,
        0 8px 25px rgba(0,0,0,.35);

    animation:
        titleFloat 3s ease-in-out infinite;
}

header p{

    margin-top:8px;

    color:white;

    font-size:18px;

    font-weight:bold;

    text-shadow:
        0 2px 5px rgba(0,0,0,.3);
}

@keyframes titleFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}


/* =========================================================
   MAIN GAME PANEL
========================================================= */

.game{

    width:min(1050px,94%);

    margin:
        20px
        auto
        90px;

    padding:28px;

    border-radius:30px;

    background:
        rgba(255,255,255,.92);

    box-shadow:
        0 25px 70px rgba(0,0,0,.25);

    backdrop-filter:
        blur(12px);
}


/* =========================================================
   STATUS
========================================================= */

.status{

    text-align:center;

    padding:15px;

    margin-bottom:22px;

    border-radius:18px;

    background:#e8f5e9;

    border:
        2px solid #a5d6a7;

    font-weight:bold;

    transition:.3s;
}


/* =========================================================
   SPIN AREA
========================================================= */

.spinArea{

    text-align:center;

    margin-bottom:25px;
}

.spinButton{

    border:none;

    border-radius:60px;

    padding:
        17px
        45px;

    font-size:20px;

    font-weight:bold;

    color:white;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ff9800,
            #f44336
        );

    box-shadow:
        0 9px 25px rgba(244,67,54,.35);

    transition:
        transform .2s,
        box-shadow .2s;
}

.spinButton:hover{

    transform:
        translateY(-4px)
        scale(1.03);

    box-shadow:
        0 14px 30px rgba(244,67,54,.45);
}

.spinButton:active{

    transform:
        scale(.94);
}

.spinButton.spinning{

    animation:
        spinButtonAnimation .5s
        linear infinite;
}

@keyframes spinButtonAnimation{

    0%{
        transform:rotate(-3deg) scale(1);
    }

    50%{
        transform:rotate(3deg) scale(1.05);
    }

    100%{
        transform:rotate(-3deg) scale(1);
    }
}


/* =========================================================
   SECTION TITLE
========================================================= */

.sectionTitle{

    text-align:center;

    margin:
        20px
        0
        15px;

    font-size:25px;

    color:#2e7d32;
}


/* =========================================================
   COLOR BUTTONS
========================================================= */

.colors{

    display:grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:12px;
}

.colorBtn{

    min-height:72px;

    border:none;

    border-radius:18px;

    padding:15px 8px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 6px 15px rgba(0,0,0,.18);

    transition:.25s;
}

.colorBtn:hover{

    transform:
        translateY(-5px)
        scale(1.02);
}

.colorBtn.selected{

    transform:
        translateY(-5px)
        scale(1.05);

    outline:
        4px solid white;

    box-shadow:
        0 0 0 6px #333,
        0 10px 25px rgba(0,0,0,.25);
}

.red{
    background:#e53935;
}

.green{
    background:#43a047;
}

.blue{
    background:#1e88e5;
}

.orange{
    background:#fb8c00;
}

.yellow{
    background:#fbc02d;
    color:#333;
}

.brown{
    background:#795548;
}


/* =========================================================
   LETTER OPTIONS
========================================================= */

.letters{

    display:none;

    grid-template-columns:
        repeat(5,1fr);

    gap:12px;

    margin-top:15px;

    animation:
        lettersAppear .4s ease;
}

.letters.show{

    display:grid;
}

@keyframes lettersAppear{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.letterBtn{

    padding:18px;

    border:
        3px solid #8bc34a;

    background:#f1f8e9;

    border-radius:18px;

    font-size:25px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.letterBtn:hover{

    background:#c8e6c9;

    transform:
        translateY(-4px)
        scale(1.04);
}

.letterBtn.selected{

    background:#66bb6a;

    color:white;

    transform:
        scale(1.06);

    box-shadow:
        0 8px 18px rgba(76,175,80,.3);
}


/* =========================================================
   RESULT
========================================================= */

.reveal{

    display:none;

    margin-top:30px;

    text-align:center;

    animation:
        revealAnimation .7s ease;
}

.reveal.show{

    display:block;
}

@keyframes revealAnimation{

    from{

        opacity:0;

        transform:
            scale(.5)
            rotate(-8deg);
    }

    to{

        opacity:1;

        transform:
            scale(1)
            rotate(0);
    }
}

.resultCard{

    position:relative;

    overflow:hidden;

    padding:28px;

    border-radius:28px;

    border:
        4px solid #81c784;

    background:
        linear-gradient(
            135deg,
            #fff8e1,
            #e8f5e9
        );

    box-shadow:
        0 12px 30px rgba(0,0,0,.12);
}

.resultCard::before{

    content:"✨";

    position:absolute;

    left:-10px;
    top:-30px;

    font-size:90px;

    opacity:.12;
}

.resultCard::after{

    content:"🌟";

    position:absolute;

    right:-10px;
    bottom:-30px;

    font-size:90px;

    opacity:.12;
}


/* =========================================================
   ANIMAL
========================================================= */

.resultAnimal{

    font-size:105px;

    margin:8px;

    animation:
        animalBounce 1s
        ease-in-out infinite alternate;
}

@keyframes animalBounce{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-10px);
    }
}


/* =========================================================
   RESULT TEXT
========================================================= */

.resultName{

    font-size:34px;

    font-weight:900;

    color:#2e7d32;
}

.resultPath{

    margin-top:8px;

    color:#777;

    font-weight:bold;
}

.reward{

    display:inline-block;

    margin-top:14px;

    padding:
        13px
        25px;

    border-radius:40px;

    background:#ffca28;

    font-size:22px;

    font-weight:bold;

    box-shadow:
        0 6px 15px rgba(255,193,7,.35);
}


/* =========================================================
   FOOTER
========================================================= */

footer{

    text-align:center;

    padding:15px;

    color:white;

    font-weight:bold;

    text-shadow:
        0 2px 5px rgba(0,0,0,.3);
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti{

    position:fixed;

    top:-30px;

    z-index:10000;

    font-size:22px;

    pointer-events:none;

    animation:
        confettiFall 2.7s
        linear forwards;
}

@keyframes confettiFall{

    to{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .game{

        width:94%;

        padding:17px;

        border-radius:23px;
    }

    .colors{

        grid-template-columns:
            repeat(2,1fr);
    }

    .letters{

        grid-template-columns:
            repeat(5,1fr);

        gap:7px;
    }

    .letterBtn{

        padding:14px 5px;

        font-size:21px;
    }

    .resultAnimal{

        font-size:80px;
    }

    .resultName{

        font-size:28px;
    }

    .tree{

        font-size:50px;
    }

    .watermark{

        right:10px;
        bottom:10px;

        font-size:12px;

        padding:8px 12px;
    }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:420px){

    header h1{

        font-size:37px;
    }

    header p{

        font-size:15px;
    }

    .game{

        margin-top:10px;
    }

    .spinButton{

        width:100%;

        padding:16px 10px;

        font-size:18px;
    }

    .colorBtn{

        min-height:62px;

        font-size:15px;
    }

    .letterBtn{

        font-size:18px;

        padding:13px 4px;
    }

    .resultCard{

        padding:20px;
    }

    .resultAnimal{

        font-size:70px;
    }

    .reward{

        font-size:18px;
    }
}

</style>
</head>

/* =========================================================

const animals = [

/* =========================================================
   GAME VARIABLES
========================================================= */

let arrangement = [];

let selectedColor = null;

let selectedLetter = null;


/* =========================================================
   SHUFFLE FUNCTION

   Fisher-Yates shuffle

   This creates a genuinely different random
   arrangement each time the user presses SPIN.
========================================================= */

function shuffle(array){

    let result = [...array];

    for(
        let i = result.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }

    return result;
}


/* =========================================================
   SPIN GAME
========================================================= */

function spinGame(){

    const button =
        document.getElementById("spinBtn");

    const status =
        document.getElementById("status");


    /* Prevent multiple spins */

    button.disabled = true;

    button.classList.add("spinning");


    status.innerHTML =
        "🎡 Shuffling the Lucky Park...";


    /* Hide previous result */

    document
        .getElementById("reveal")
        .classList.remove("show");


    /*
       CREATE NEW RANDOM ARRANGEMENT
    */

    arrangement =
        shuffle(animals);


    /*
       Small animation delay
    */

    setTimeout(function(){

        button.disabled = false;

        button.classList.remove("spinning");


        selectedColor = null;

        selectedLetter = null;


        /* Reset colours */

        document
            .querySelectorAll(".colorBtn")
            .forEach(function(btn){

                btn.classList.remove("selected");

            });


        /* Reset letters */

        document
            .querySelectorAll(".letterBtn")
            .forEach(function(btn){

                btn.classList.remove("selected");

            });


        /* Hide letters */

        document
            .querySelector(".letters")
            .classList.remove("show");


        status.innerHTML =
            "🍀 New arrangement ready! Choose a colour.";

    },1200);

}


/* =========================================================
   CHOOSE COLOR
========================================================= */

function chooseColor(color,button){


    /*
       User must spin before playing
    */

    if(arrangement.length === 0){

        alert(
            "🎲 Please press SPIN first!"
        );

        return;
    }


    selectedColor = color;


    /* Remove old selection */

    document
        .querySelectorAll(".colorBtn")
        .forEach(function(btn){

            btn.classList.remove("selected");

        });


    /* Select current colour */

    button.classList.add("selected");


    /* Show A B C D E */

    document
        .querySelector(".letters")
        .classList.add("show");


    /* Reset letter */

    selectedLetter = null;


    document
        .querySelectorAll(".letterBtn")
        .forEach(function(btn){

            btn.classList.remove("selected");

        });


    /* Hide old result */

    document
        .getElementById("reveal")
        .classList.remove("show");


    document
        .getElementById("status")
        .innerHTML =
        `🎨 ${color} selected!
         Now choose A, B, C, D or E.`;

}


/* =========================================================
   CHOOSE LETTER
========================================================= */

function chooseLetter(letter,button){


    if(!selectedColor){

        alert(
            "🎨 Please choose a colour first!"
        );

        return;
    }


    selectedLetter = letter;


    /* Reset other letters */

    document
        .querySelectorAll(".letterBtn")
        .forEach(function(btn){

            btn.classList.remove("selected");

        });


    button.classList.add("selected");


    /*
       COLOUR POSITION

       RED    = 0-4
       GREEN  = 5-9
       BLUE   = 10-14
       ORANGE = 15-19
       YELLOW = 20-24
       BROWN  = 25-29
    */

    const colors = [

        "Red",
        "Green",
        "Blue",
        "Orange",
        "Yellow",
        "Brown"

    ];


    const letters = [

        "A",
        "B",
        "C",
        "D",
        "E"

    ];


    const colorIndex =
        colors.indexOf(selectedColor);


    const letterIndex =
        letters.indexOf(letter);


    /*
       Convert colour + letter
       into one of the 30 random positions.
    */

    const position =
        colorIndex * 5 +
        letterIndex;


    const animal =
        arrangement[position];


    showResult(animal);

}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult(animal){


    document
        .getElementById("animalEmoji")
        .textContent =
        animal.emoji;


    document
        .getElementById("animalName")
        .textContent =
        animal.name;


    document
        .getElementById("resultPath")
        .textContent =
        `${selectedColor} → ${selectedLetter}`;


    document
        .getElementById("reward")
        .textContent =
        animal.reward;


    document
        .getElementById("reveal")
        .classList.add("show");


    document
        .getElementById("status")
        .innerHTML =
        "🎉 Congratulations! You discovered your lucky animal!";


    createConfetti();


    /*
       Scroll result into view
    */

    document
        .getElementById("reveal")
        .scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(){


    const symbols = [

        "🎉",
        "✨",
        "🌟",
        "🍀",
        "🎊",
        "⭐",
        "🌿"

    ];


    for(
        let i = 0;
        i < 40;
        i++
    ){

        const confetti =
            document.createElement("div");


        confetti.className =
            "confetti";


        confetti.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        confetti.style.left =
            Math.random() * 100 + "vw";


        confetti.style.animationDelay =
            Math.random() * .8 + "s";


        confetti.style.fontSize =
            (15 + Math.random() * 15) + "px";


        document.body.appendChild(
            confetti
        );


        setTimeout(
            function(){

                confetti.remove();

            },
            3500
        );

    }

}


/* =========================================================
   END
========================================================= */

</script>
